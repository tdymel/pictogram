[package]
name = "pictogram-icons-font-awesome"
version = "0.4.1"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Font Awesome icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "font-awesome"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.1" }

[features]
# `LIBRARY`: the index of all icons, to list and search them.
index = []

# Read and written by `cargo xtask update font-awesome`.
[package.metadata.pictogram]
upstream = "https://github.com/FortAwesome/Font-Awesome"
upstream-version = "7.3.1"
