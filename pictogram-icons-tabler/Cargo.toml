[package]
name = "pictogram-icons-tabler"
version = "0.4.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Tabler icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "tabler"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.0" }

# Read and written by `cargo xtask update tabler`.
[package.metadata.pictogram]
upstream = "https://github.com/tabler/tabler-icons"
upstream-version = "3.48.0"
