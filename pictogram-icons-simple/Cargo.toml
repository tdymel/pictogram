[package]
name = "pictogram-icons-simple"
version = "0.5.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Simple icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "simple"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.5.0" }

[features]
# `LIBRARY`: the index of all icons, to list and search them.
index = []

# Read and written by `cargo xtask update simple`.
[package.metadata.pictogram]
upstream = "https://github.com/simple-icons/simple-icons"
upstream-version = "16.33.0"
