[package]
name = "pictogram-icons-feather"
version = "0.4.1"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Feather design icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "feather"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.1" }

[features]
# `LIBRARY`: the index of all icons, to list and search them.
index = []

# Read and written by `cargo xtask update feather`.
[package.metadata.pictogram]
upstream = "https://github.com/feathericons/feather"
upstream-version = "4.29.2"
