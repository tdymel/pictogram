[package]
name = "pictogram-icons-phosphor"
version = "0.4.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Phosphor icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "phosphor"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.0" }

# Read and written by `cargo xtask update phosphor`.
[package.metadata.pictogram]
upstream = "https://github.com/phosphor-icons/core"
upstream-version = "2.0.8"
