[package]
name = "pictogram-icons-bootstrap"
version = "0.3.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Bootstrap icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "bootstrap"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.3.0" }

# Read and written by `cargo xtask update bootstrap`.
[package.metadata.pictogram]
upstream = "https://github.com/twbs/icons"
upstream-version = "1.13.1"
