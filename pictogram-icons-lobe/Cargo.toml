[package]
name = "pictogram-icons-lobe"
version = "0.4.2"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Lobe icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "lobe"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.1" }

[features]
# `LIBRARY`: the index of all icons, to list and search them.
index = []

# Read and written by `cargo xtask update lobe`.
[package.metadata.pictogram]
upstream = "https://github.com/lobehub/lobe-icons"
upstream-version = "1.95.1"
