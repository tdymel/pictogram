[package]
name = "pictogram"
version = "0.4.4"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "../README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "A compile time svg icon catalogue."
keywords = ["icons", "svg", "dioxus", "leptos"]
categories = ["gui", "web-programming", "accessibility", "wasm"]
exclude = ["tests"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.1" }
pictogram-icons-lucide = { path = "../pictogram-icons-lucide", version = "0.4.1", optional = true }
pictogram-icons-bootstrap = { path = "../pictogram-icons-bootstrap", version = "0.4.1", optional = true }
pictogram-icons-feather = { path = "../pictogram-icons-feather", version = "0.4.1", optional = true }
pictogram-icons-font-awesome = { path = "../pictogram-icons-font-awesome", version = "0.4.1", optional = true }
pictogram-icons-hero = { path = "../pictogram-icons-hero", version = "0.4.1", optional = true }
pictogram-icons-iconoir = { path = "../pictogram-icons-iconoir", version = "0.4.1", optional = true }
pictogram-icons-ion = { path = "../pictogram-icons-ion", version = "0.4.1", optional = true }
pictogram-icons-lobe = { path = "../pictogram-icons-lobe", version = "0.4.2", optional = true }
pictogram-icons-oct = { path = "../pictogram-icons-oct", version = "0.4.1", optional = true }
pictogram-icons-phosphor = { path = "../pictogram-icons-phosphor", version = "0.4.1", optional = true }
pictogram-icons-simple = { path = "../pictogram-icons-simple", version = "0.4.2", optional = true }
pictogram-icons-tabler = { path = "../pictogram-icons-tabler", version = "0.4.1", optional = true }
pictogram-icons-vscode = { path = "../pictogram-icons-vscode", version = "0.4.1", optional = true }
pictogram-icons-material = { path = "../pictogram-icons-material", version = "0.4.2", optional = true }

[features]
default = ["bootstrap", "feather", "font-awesome", "hero", "iconoir", "ion", "lobe", "lucide", "material", "oct", "phosphor", "simple", "tabler", "vscode"]
lucide = ["dep:pictogram-icons-lucide"]
bootstrap = ["dep:pictogram-icons-bootstrap"]
feather = ["dep:pictogram-icons-feather"]
font-awesome = ["dep:pictogram-icons-font-awesome"]
hero = ["dep:pictogram-icons-hero"]
iconoir = ["dep:pictogram-icons-iconoir"]
ion = ["dep:pictogram-icons-ion"]
lobe = ["dep:pictogram-icons-lobe"]
oct = ["dep:pictogram-icons-oct"]
phosphor = ["dep:pictogram-icons-phosphor"]
simple = ["dep:pictogram-icons-simple"]
tabler = ["dep:pictogram-icons-tabler"]
vscode = ["dep:pictogram-icons-vscode"]
material = ["dep:pictogram-icons-material"]
# `LIBRARIES`: the index of all icons of the enabled libraries.
index = ["pictogram-icons-bootstrap?/index", "pictogram-icons-feather?/index", "pictogram-icons-font-awesome?/index", "pictogram-icons-hero?/index", "pictogram-icons-iconoir?/index", "pictogram-icons-ion?/index", "pictogram-icons-lobe?/index", "pictogram-icons-lucide?/index", "pictogram-icons-material?/index", "pictogram-icons-oct?/index", "pictogram-icons-phosphor?/index", "pictogram-icons-simple?/index", "pictogram-icons-tabler?/index", "pictogram-icons-vscode?/index"]
