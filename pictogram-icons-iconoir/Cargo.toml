[package]
name = "pictogram-icons-iconoir"
version = "0.4.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "Iconoir icons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "iconoir"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.4.0" }

# Read and written by `cargo xtask update iconoir`.
[package.metadata.pictogram]
upstream = "https://github.com/iconoir-icons/iconoir"
upstream-version = "7.12.1"
