[package]
name = "pictogram-icons-vscode"
version = "0.3.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
readme = "README.md"
repository = "https://github.com/tdymel/pictogram"
documentation = "https://docs.rs/pictogram"
license = "MIT OR Apache-2.0"
description = "VSCode Codicons export for pictogram"
keywords = ["icons", "svg", "dioxus", "leptos", "vscode-codicons"]
categories = ["gui", "web-programming", "accessibility", "wasm"]

[dependencies]
pictogram-core = { path = "../pictogram-core", version = "0.3.0" }

# Read and written by `cargo xtask update vscode`.
[package.metadata.pictogram]
upstream = "https://github.com/microsoft/vscode-codicons"
upstream-version = "0.0.45"
