name: Update lucide

# Regenerates pictogram-icons-lucide from a release of lucide and opens a pull request.
# The versions of the crates are bumped by `cargo xtask`: a patch release if icons were added,
# a minor release (breaking in 0.x) if icons were removed.
#
# It is started manually for now. To check for releases every day, add to `on:`
#   schedule:
#     - cron: "17 5 * * *"
#
# The repository setting "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General) has to be enabled.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lucide release to use, like 1.8.0 (default: the latest release)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency: update-lucide

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: lucide-icons/lucide
      CRATE: pictogram-icons-lucide
    steps:
      - uses: actions/checkout@v4

      - name: Find the release to use
        id: release
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release like 1.2.3"
            exit 1
          fi
          current="$(sed -n 's/^upstream-version = "\(.*\)"/\1/p' "$CRATE/Cargo.toml")"
          branch="update/lucide-$version"

          update=true
          if [[ "$current" == "$version" ]]; then
            echo "Already on lucide $version."
            update=false
          elif [[ -z "$REQUESTED" && "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "The latest release $version is older than $current."
            update=false
          elif git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "The branch $branch exists already."
            update=false
          fi
          {
            echo "update=$update"
            echo "tag=$tag"
            echo "version=$version"
            echo "current=$current"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the icons
        if: steps.release.outputs.update == 'true'
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${{ steps.release.outputs.tag }}" \
            "https://github.com/$UPSTREAM" "$RUNNER_TEMP/lucide"
          cargo xtask lucide \
            --source "$RUNNER_TEMP/lucide" \
            --version "${{ steps.release.outputs.version }}" \
            --summary "$RUNNER_TEMP/summary.md"

      - name: Test
        if: steps.release.outputs.update == 'true'
        run: cargo test --workspace

      - name: Open a pull request
        if: steps.release.outputs.update == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          branch="${{ steps.release.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git commit -m "Update lucide to $version"
          git push origin "$branch"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by \`cargo xtask lucide\` from https://github.com/$UPSTREAM/releases/tag/${{ steps.release.outputs.tag }}."
            echo "The versions were bumped by the generator. Publishing is not automated."
          } > "$RUNNER_TEMP/body.md"
          gh pr create \
            --title "Update lucide to $version" \
            --body-file "$RUNNER_TEMP/body.md" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"
