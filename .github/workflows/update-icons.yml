name: Update icons

# Regenerates the icons of a library from a release of its upstream project and opens a pull request.
# The versions of the crates are bumped by `cargo xtask`: a patch release if icons were added,
# a minor release (breaking in 0.x) if icons were removed.
#
# It is started manually for now. To check for releases every day, add to `on:`
#   schedule:
#     - cron: "17 5 * * *"
# and run it for every library (a matrix over `library`).
#
# The repository setting "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General) has to be enabled.

on:
  workflow_dispatch:
    inputs:
      library:
        description: "Library to update, like lucide (see `cargo xtask` for all of them)"
        required: true
        default: lucide
      version:
        description: "Release to use, like 1.8.0 (default: the latest release)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency: update-icons

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LIBRARY: ${{ inputs.library }}
      REQUESTED: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the icons
        id: update
        run: |
          set -euo pipefail
          if ! [[ "$LIBRARY" =~ ^[a-z-]+$ ]]; then
            echo "::error::'$LIBRARY' is not a library name"
            exit 1
          fi
          args=()
          if [[ -n "$REQUESTED" ]]; then
            args+=(--version "$REQUESTED")
          fi
          cargo xtask update "$LIBRARY" "${args[@]}" --summary "$RUNNER_TEMP/summary.md"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^upstream-version = "\(.*\)"/\1/p' "pictogram-icons-$LIBRARY/Cargo.toml")"
          {
            echo "changed=true"
            echo "version=$version"
            echo "branch=update/$LIBRARY-$version"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: cargo test --workspace

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.update.outputs.version }}"
          branch="${{ steps.update.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::The branch $branch exists already."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git commit -m "Update $LIBRARY to $version"
          git push origin "$branch"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by \`cargo xtask update $LIBRARY\`."
            echo "The versions were bumped by the generator. Publishing is not automated."
          } > "$RUNNER_TEMP/body.md"
          gh pr create \
            --title "Update $LIBRARY to $version" \
            --body-file "$RUNNER_TEMP/body.md" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"
